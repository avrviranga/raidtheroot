worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 64M;

    # Access logging - evidence for the "logging and monitoring" control.
    log_format rtr '$remote_addr - [$time_local] "$request" '
                   '$status $body_bytes_sent host=$host';
    access_log /var/log/nginx/access.log rtr;
    error_log  /var/log/nginx/error.log warn;

    # Rate limiting: deters brute-force flag guessing and endpoint enumeration
    # against the control plane. 10 req/s with a burst allowance.
    limit_req_zone $binary_remote_addr zone=rtr_limit:10m rate=10r/s;

    # ---- HTTP: redirect everything to HTTPS -------------------------------
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---- CTFd control plane ----------------------------------------------
    server {
        listen 443 ssl;
        server_name ctf.rtr.local;

        ssl_certificate     /etc/nginx/certs/rtr.crt;
        ssl_certificate_key /etc/nginx/certs/rtr.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            limit_req zone=rtr_limit burst=20 nodelay;

            proxy_pass http://rtr-ctfd:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---- Stage 3 challenge: VAULT-03 internal portal ----------------------
    # Participants reach this only after Stage 2 reveals the hostname.
    server {
        listen 443 ssl;
        server_name vault-03.rtr.local;

        ssl_certificate     /etc/nginx/certs/rtr.crt;
        ssl_certificate_key /etc/nginx/certs/rtr.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            limit_req zone=rtr_limit burst=50 nodelay;

            proxy_pass http://rtr-stage3:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The challenge returns a custom header that Stage 4 depends on;
            # make sure the proxy does not strip it.
            proxy_pass_header X-Cipher-Hint;
        }
    }

    # ---- Default: reject anything not addressed by hostname ---------------
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/rtr.crt;
        ssl_certificate_key /etc/nginx/certs/rtr.key;

        return 444;
    }
}
